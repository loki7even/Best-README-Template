name: CI

# Lint et build sur chaque pull request et sur main.
# Tant que le dépôt n'a pas de package-lock.json (modèle vierge), les étapes Node sont ignorées.
# hashFiles() n'est pas permis dans le `env` d'un job (le workflow échouait au démarrage) : le test est fait dans chaque `if`.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Le quota de minutes est partagé entre tous les dépôts privés : un job bloqué ne doit pas le vider
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Projet sans package-lock.json
        if: hashFiles('package-lock.json') == ''
        run: echo "::notice::Aucun package-lock.json, étapes Node ignorées."

      - uses: actions/setup-node@v4
        if: hashFiles('package-lock.json') != ''
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installation
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Lint
        if: hashFiles('package-lock.json') != ''
        run: npm run lint --if-present

      - name: Build
        if: hashFiles('package-lock.json') != ''
        run: npm run build --if-present

      - name: Tests
        if: hashFiles('package-lock.json') != ''
        run: npm test --if-present
