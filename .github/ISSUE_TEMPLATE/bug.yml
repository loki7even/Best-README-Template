name: Bug
description: Quelque chose ne fonctionne pas comme prévu
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Ce qui se passe, et ce qui devrait se passer.
    validations:
      required: true
  - type: textarea
    id: etapes
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Aller sur la page…
        2. Cliquer sur…
        3. Voir l'erreur
    validations:
      required: true
  - type: input
    id: environnement
    attributes:
      label: Environnement
      placeholder: "Production / local · Chrome 130 · iPhone 15"
  - type: textarea
    id: captures
    attributes:
      label: Captures ou logs
      description: Glisser une image ou coller le message d'erreur.
