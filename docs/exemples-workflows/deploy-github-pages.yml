name: Déploiement GitHub Pages

# Publie dist/ sur GitHub Pages à la demande (bouton Run workflow).
# Activer une fois : Settings > Pages > Source : GitHub Actions.
# Pour un site servi sous /nom-du-depot/, régler `base: '/nom-du-depot/'` dans vite.config.ts.

on:
  # Par défaut, mise en ligne seulement à la demande (Actions > ce workflow > Run workflow, branche main) :
  # une fusion sur main ne consomme aucune minute. Pour un client qui veut une mise en ligne à chaque fusion,
  # décommenter le bloc push (accord de Lounes, voir docs/quota-github-actions.md).
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths-ignore: ['**.md', 'docs/**']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
