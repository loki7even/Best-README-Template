name: Déploiement OVH

# Publie le site sur l'hébergement web OVH (dossier www) en FTPS à chaque push sur main.
# Inactif tant que la variable de dépôt OVH_DEPLOY ne vaut pas « oui » (Settings > Secrets and variables >
# Actions > onglet Variables) : la passer à « non » coupe les mises en ligne sans toucher au fichier.
# Envoi à la main (quota Actions atteint) : FileZilla, voir docs/ftp-sftp-filezilla.md, puis supprimer
# www/.ftp-deploy-sync-state.json avant de relancer ce workflow.
# Secrets à créer dans GitHub > Settings > Secrets and variables > Actions :
#   OVH_FTP_SERVER    ex. ftp.cluster0XX.hosting.ovh.net
#   OVH_FTP_USERNAME  identifiant FTP
#   OVH_FTP_PASSWORD  mot de passe FTP

on:
  push:
    branches: [main]
    # Un changement de doc seul ne redéploie pas (économise les minutes Actions)
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: deploy-ovh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: vars.OVH_DEPLOY == 'oui'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Envoi FTP vers l'hébergement OVH (dossier www)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.OVH_FTP_SERVER }}
          username: ${{ secrets.OVH_FTP_USERNAME }}
          password: ${{ secrets.OVH_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./www/
